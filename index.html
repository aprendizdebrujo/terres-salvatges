<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Terres Salvatges</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Pantalla de creació de party -->
        <div id="party-creation-screen" class="screen active">
            <div class="party-creation-panel">
                <h1>Les Terres Salvatges</h1>
                <p class="subtitle">Crea el teu grup d'aventurers</p>
                
                <div class="party-progress">
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <p id="progress-text" class="progress-text">Personatge 1 de 4</p>
                </div>

                <div id="character-form" class="character-form">
                    <div class="form-group">
                        <label for="char-name">Nom del personatge:</label>
                        <input type="text" id="char-name" placeholder="Ex: Aldor, Mira, Kael..." value="">
                    </div>

                    <div class="form-group">
                        <label>Classe:</label>
                        <div class="class-selector">
                            <button class="class-btn active" data-class="warrior">
                                ⚔️ Guerrer
                            </button>
                            <button class="class-btn" data-class="mage">
                                🔮 Mag
                            </button>
                            <button class="class-btn" data-class="rogue">
                                🗡️ Lladre
                            </button>
                            <button class="class-btn" data-class="cleric">
                                ✨ Clergue
                            </button>
                        </div>
                    </div>

                    <div class="stats-display">
                        <h3>Atributs:</h3>
                        <div class="stat-row">
                            <span>Força:</span>
                            <span id="stat-str" class="stat-value">15</span>
                        </div>
                        <div class="stat-row">
                            <span>Destreza:</span>
                            <span id="stat-dex" class="stat-value">10</span>
                        </div>
                        <div class="stat-row">
                            <span>Constitució:</span>
                            <span id="stat-con" class="stat-value">13</span>
                        </div>
                        <div class="stat-row">
                            <span>Intel·ligència:</span>
                            <span id="stat-int" class="stat-value">10</span>
                        </div>
                        <div class="stat-row">
                            <span>Saviesa:</span>
                            <span id="stat-wis" class="stat-value">12</span>
                        </div>
                        <div class="stat-row">
                            <span>Carisma:</span>
                            <span id="stat-cha" class="stat-value">11</span>
                        </div>
                    </div>

                    <div class="hp-display">
                        <span>Punts de Vida:</span>
                        <span id="hp-value" class="hp-value">10</span>
                    </div>
                </div>

                <div class="party-preview">
                    <h3>El teu grup:</h3>
                    <div id="party-list" class="party-list">
                        <!-- S'afegiran personatges aquí -->
                    </div>
                </div>

                <div class="button-group">
                    <button id="add-btn" class="btn-primary">Afegir personatge</button>
                    <button id="start-btn" class="btn-secondary" disabled>Començar l'aventura!</button>
                </div>
            </div>
        </div>

        <!-- Pantalla principal del joc -->
        <div id="main-game-screen" class="screen">
            <div id="game-world"></div>
            
            <!-- Interfície inferior amb informació del party -->
            <div id="party-panel" class="party-panel">
                <div id="party-members" class="party-members">
                    <!-- Els membres del party apareixeran aquí -->
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
