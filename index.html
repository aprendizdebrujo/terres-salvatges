<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Terres Salvatges</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Pantalla de creació de personatges -->
        <div id="character-creation-screen" class="screen active">
            <div class="character-creation-panel">
                <h1>Les Terres Salvatges</h1>
                <p class="subtitle">Crea el teu personatge</p>
                
                <div class="form-group">
                    <label for="char-name">Nom del personatge:</label>
                    <input type="text" id="char-name" placeholder="Ex: Aldor, Mira, Kael..." value="Aventurer">
                </div>

                <div class="form-group">
                    <label>Classe:</label>
                    <div class="class-selector">
                        <button class="class-btn active" data-class="warrior">
                            ⚔️ Guerrer
                        </button>
                        <button class="class-btn" data-class="mage">
                            🔮 Mag
                        </button>
                        <button class="class-btn" data-class="rogue">
                            🗡️ Lladre
                        </button>
                        <button class="class-btn" data-class="cleric">
                            ✨ Clergue
                        </button>
                    </div>
                </div>

                <div class="stats-display">
                    <h3>Atributs:</h3>
                    <div class="stat-row">
                        <span>Força:</span>
                        <span id="stat-str" class="stat-value">15</span>
                    </div>
                    <div class="stat-row">
                        <span>Destreza:</span>
                        <span id="stat-dex" class="stat-value">10</span>
                    </div>
                    <div class="stat-row">
                        <span>Constitució:</span>
                        <span id="stat-con" class="stat-value">13</span>
                    </div>
                    <div class="stat-row">
                        <span>Intel·ligència:</span>
                        <span id="stat-int" class="stat-value">10</span>
                    </div>
                    <div class="stat-row">
                        <span>Saviesa:</span>
                        <span id="stat-wis" class="stat-value">12</span>
                    </div>
                    <div class="stat-row">
                        <span>Carisma:</span>
                        <span id="stat-cha" class="stat-value">11</span>
                    </div>
                </div>

                <div class="hp-display">
                    <span>Punts de Vida:</span>
                    <span id="hp-value" class="hp-value">10</span>
                </div>

                <button id="create-btn" class="btn-primary">Començar l'aventura!</button>
            </div>
        </div>

        <!-- Pantalla principal del joc -->
        <div id="main-game-screen" class="screen">
            <div id="game-world"></div>
            
            <!-- Interfície inferior amb informació del personatge -->
            <div id="character-panel" class="character-panel">
                <div class="char-portrait">
                    <div id="portrait-sprite" class="portrait-sprite"></div>
                </div>
                <div class="char-info">
                    <div class="char-name" id="panel-char-name">Aventurer</div>
                    <div class="char-class" id="panel-char-class">Guerrer</div>
                    <div class="hp-bar">
                        <div id="hp-bar-fill" class="hp-bar-fill"></div>
                    </div>
                    <div class="hp-text">
                        <span id="panel-hp">10</span>/<span id="panel-max-hp">10</span> HP
                    </div>
                </div>
                <div class="char-stats-mini">
                    <div class="stat-mini">
                        <span>STR:</span>
                        <span id="panel-str">15</span>
                    </div>
                    <div class="stat-mini">
                        <span>DEX:</span>
                        <span id="panel-dex">10</span>
                    </div>
                    <div class="stat-mini">
                        <span>CON:</span>
                        <span id="panel-con">13</span>
                    </div>
                    <div class="stat-mini">
                        <span>INT:</span>
                        <span id="panel-int">10</span>
                    </div>
                    <div class="stat-mini">
                        <span>WIS:</span>
                        <span id="panel-wis">12</span>
                    </div>
                    <div class="stat-mini">
                        <span>CHA:</span>
                        <span id="panel-cha">11</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
